name: CI

# Intégration continue : à chaque push et pull request, on installe les
# dépendances de façon reproductible (npm ci) et on lance toute la suite Jest.
# L'app est du Node/Express + frontend vanilla ES6 servi statiquement :
# il n'y a AUCUNE étape de bundling/transpilation — le "build" se limite à
# l'install des deps et à la validation par les tests.
#
# Déploiement (job deploy) : uniquement sur push vers main, APRÈS succès des
# tests, vers Railway via la CLI. Nécessite le secret RAILWAY_TOKEN (et
# éventuellement la variable RAILWAY_SERVICE). Sans le secret, le job se
# contente d'un avertissement et ne déploie rien.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Annule les runs obsolètes quand on pousse plusieurs fois d'affilée.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint parse + tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Syntax check (backend entrypoints)
        run: |
          node --check src/app.js
          node --check src/routes/ai.js
          node --check src/services/aiService.js

      - name: Run test suite
        run: npm run test:ci
        env:
          NODE_ENV: test

  deploy:
    name: Deploy to Railway
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Railway token
        id: check
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RAILWAY_TOKEN absent — déploiement ignoré. Ajoute-le dans Settings > Secrets and variables > Actions."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.check.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        if: steps.check.outputs.has_token == 'true'
        run: npm i -g @railway/cli

      - name: Deploy
        if: steps.check.outputs.has_token == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "${{ vars.RAILWAY_SERVICE }}" ]; then
            railway up --detach --service "${{ vars.RAILWAY_SERVICE }}"
          else
            railway up --detach
          fi
