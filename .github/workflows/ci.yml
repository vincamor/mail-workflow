name: CI

# Continuous integration: on every push and pull request we install the
# dependencies reproducibly (npm ci) and run the whole Jest suite.
# The app is Node/Express + a vanilla ES6 front-end served statically:
# there is NO bundling/transpilation step — the "build" is limited to
# installing deps and validating with the tests.
#
# There is deliberately NO deploy job. Mail Workflow is meant to be cloned and
# run by each user on their own machine; it is not a service this repository
# deploys anywhere. Self-hosting instructions live in docs/guides/deployment.md,
# where they belong — as documentation a reader chooses to follow, not as a
# pipeline step that warns on every run about a secret nobody else has.
#
# Supply-chain hardening notes:
#   - Third-party actions are pinned to full commit SHAs (a tag is mutable and
#     can be re-pointed at malicious code; a SHA cannot). The comment next to
#     each pin names the tag it corresponds to. `.github/dependabot.yml` keeps
#     these pins fresh via the github-actions ecosystem.
#   - GITHUB_TOKEN permissions are read-only by default (top-level block) and
#     widened per job only where genuinely required.

on:
  # Only main on push. Branch work is covered by the pull_request trigger, and
  # listening to both on every branch ran the whole suite twice per pull
  # request — visible immediately on the first Dependabot batch.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN. Without this block the workflow inherits
# the repository default, which on many repos is read-write for everything.
# Jobs that need more must opt in with their own `permissions:` block.
permissions:
  contents: read

# Cancel stale runs when several pushes land back to back.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Syntax check + tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # only needs to read the code out of the repo
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Syntax check (backend entrypoints)
        run: |
          node --check src/app.js
          node --check src/routes/ai.js
          node --check src/services/aiService.js

      - name: Run test suite
        run: npm run test:ci
        env:
          NODE_ENV: test

  # Plays the path a brand-new user actually takes, on a machine that has never
  # seen this project: clone, npm install (not npm ci), then run the app with no
  # .env at all. The test job proves the code works; this one proves the
  # onboarding works, which is a different claim and the one that breaks
  # silently — the missing demo fixtures were exactly this kind of failure.
  install:
    name: Fresh install (what a new user gets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      # npm install, deliberately, not npm ci: this is what a new user runs, and
      # it exercises the lockfile differently.
      - name: npm install
        run: npm install

      # With no .env, doctor must FAIL and say why. If it ever exits 0 here, it
      # has stopped detecting an unconfigured project and is useless.
      - name: doctor detects an unconfigured project
        run: |
          if npm run doctor --silent; then
            echo "::error::npm run doctor exited 0 with no .env — it should fail"
            exit 1
          fi
          echo "doctor correctly exited non-zero"

      - name: demo boots with no .env and serves the fixture
        run: |
          node scripts/demo.js &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "http://localhost:3000/health"; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null "http://localhost:3000/health"
          curl -sf -o /dev/null "http://localhost:3000/?demo=1"
          curl -sf -o /dev/null "http://localhost:3000/demo/gmail_emails.jsonl"
          curl -sf -o /dev/null "http://localhost:3000/demo/gmail_emails_html.jsonl"
          curl -sf -o /dev/null "http://localhost:3000/services/emailAnalyzer_browser.js"
          echo "demo mode serves every asset it needs"

  lint:
    name: Lint + format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      # NOTE: this job is intentionally blocking (no continue-on-error). The
      # ESLint/Prettier configuration is landing alongside this workflow, so the
      # very first run may go red until `eslint.config.js` / `.prettierrc` and
      # the matching devDependencies are committed. Fix the config — do not mute
      # the job.
      - name: ESLint
        run: npm run lint

      - name: Prettier (check only)
        run: npm run format:check

      # Fails on high and critical advisories only. Moderate and low ones are
      # reported but do not block: this is a local-first app with no server-side
      # data store, and a blocking gate on every low advisory would train people
      # to bypass it — which is worse than not having it.
      #
      # This is the check that actually matters. Dependabot's *version* updates
      # are convenience; being told about a vulnerability is not.
      - name: Audit dependencies
        run: npm audit --audit-level=high
